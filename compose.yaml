# Local development database, started by Spring Boot when the application runs.
# These credentials are for a local container only; they are not production secrets.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: chess_manager
      POSTGRES_USER: chess_manager
      POSTGRES_PASSWORD: chess_manager
    ports:
      - '5432'
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
