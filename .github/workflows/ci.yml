name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests and mutation analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Java 26 and cache Maven dependencies
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
          cache-dependency-path: pom.xml

      - name: Show Java and Maven versions
        run: mvn --version

      - name: Test the report script
        run: python3 -m unittest discover --start-directory .github/scripts

      - name: Build, run JUnit, Cucumber and ArchUnit, and generate coverage
        run: mvn --batch-mode --no-transfer-progress clean verify

      # The build gate runs only @acceptance scenarios. This report-only run executes every
      # scenario so that undefined and pending ones appear in the reports; Cucumber exits
      # with a non-zero status whenever a scenario is not passing, which is expected here.
      - name: Run every Cucumber scenario to report pending ones
        run: |
          mvn --batch-mode --no-transfer-progress \
            org.apache.maven.plugins:maven-dependency-plugin:3.11.0:build-classpath \
            -Dmdep.outputFile=target/test-classpath.txt -Dmdep.includeScope=test
          java -cp "target/test-classes:target/classes:$(cat target/test-classpath.txt)" \
            io.cucumber.core.cli.Main --glue acceptance.steps --monochrome \
            --plugin json:target/cucumber-all/cucumber.json \
            --plugin html:target/cucumber-all/cucumber.html \
            classpath:features || true
          test -s target/cucumber-all/cucumber.json

      - name: Run PIT mutation analysis
        run: mvn --batch-mode --no-transfer-progress org.pitest:pitest-maven:mutationCoverage

      - name: Summarize reports and assemble the report site
        if: ${{ always() }}
        run: python3 .github/scripts/ci_report.py target target/report-site >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report site for GitHub Pages
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/report-site

      - name: Upload test, coverage and mutation reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/cucumber/
            target/cucumber-all/
            target/site/jacoco/
            target/pit-reports/
          retention-days: 14
          if-no-files-found: warn

  publish-reports:
    name: Publish reports to GitHub Pages
    needs: tests
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
      - name: Deploy the report site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
